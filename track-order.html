<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 35%, #f8fafc 65%, #fff 100%);
        }

        /* ── Sky ground line ── */
        .ground {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            background: linear-gradient(180deg, transparent, rgba(219,234,254,.4));
            z-index: 0;
        }

        /* ── Stars (tiny dots) ── */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #93c5fd;
            opacity: .5;
            animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
        }
        @keyframes twinkle {
            0%,100% { opacity: .2; transform: scale(1); }
            50%      { opacity: .7; transform: scale(1.4); }
        }

        /* ── Clouds ── */
        .clouds-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            display: flex;
            align-items: flex-end;
            animation: drift-cloud var(--speed, 60s) linear infinite;
            opacity: var(--op, .9);
            transform: translateX(-320px);
        }

        @keyframes drift-cloud {
            from { transform: translateX(-320px); }
            to   { transform: translateX(calc(100vw + 320px)); }
        }

        /* Cloud shape using layered divs */
        .cloud-body {
            position: relative;
            background: #fff;
            border-radius: 50px;
            box-shadow: 0 4px 24px rgba(147,197,253,.3);
        }
        .cloud-body::before,
        .cloud-body::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }

        /* Cloud sizes */
        .cloud-lg .cloud-body              { width: 200px; height: 60px; }
        .cloud-lg .cloud-body::before      { width: 100px; height: 100px; top: -55px; left: 25px; }
        .cloud-lg .cloud-body::after       { width: 75px;  height: 75px;  top: -40px; left: 95px; }

        .cloud-md .cloud-body              { width: 140px; height: 44px; }
        .cloud-md .cloud-body::before      { width: 72px;  height: 72px;  top: -38px; left: 18px; }
        .cloud-md .cloud-body::after       { width: 55px;  height: 55px;  top: -28px; left: 68px; }

        .cloud-sm .cloud-body              { width: 90px;  height: 30px; }
        .cloud-sm .cloud-body::before      { width: 46px;  height: 46px;  top: -26px; left: 12px; }
        .cloud-sm .cloud-body::after       { width: 34px;  height: 34px;  top: -18px; left: 44px; }

        /* Individual clouds positioning */
        .c1 { top:  8%; --speed:55s; --op:.95; animation-delay:   0s; }
        .c2 { top: 18%; --speed:75s; --op:.7;  animation-delay: -20s; }
        .c3 { top: 30%; --speed:90s; --op:.55; animation-delay: -40s; }
        .c4 { top: 12%; --speed:65s; --op:.8;  animation-delay: -10s; }
        .c5 { top: 42%; --speed:100s;--op:.4;  animation-delay: -60s; }
        .c6 { top:  5%; --speed:80s; --op:.6;  animation-delay: -35s; }

        /* ── Main card ── */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 1.5rem 2rem;
            max-width: 500px;
            width: 100%;
            animation: fadeUp .7s ease-out both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Illustration: lost balloon ── */
        .illustration {
            position: relative;
            width: 180px;
            height: 220px;
            margin: 0 auto 8px;
        }

        /* Balloon */
        .balloon {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 100px;
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 60%, #4f46e5 100%);
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            box-shadow: inset -12px -8px 0 rgba(0,0,0,.08), 0 8px 32px rgba(99,102,241,.35);
            animation: balloon-float 4s ease-in-out infinite;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #4f46e5;
        }
        /* Balloon shine */
        .balloon::before {
            content: '';
            position: absolute;
            top: 18px; left: 18px;
            width: 18px; height: 24px;
            background: rgba(255,255,255,.28);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        /* String */
        .string {
            position: absolute;
            top: 100px; left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 70px;
            background: linear-gradient(180deg, #6366f1, #a5b4fc);
            border-radius: 2px;
            transform-origin: top center;
            animation: string-sway 4s ease-in-out infinite;
        }

        /* Small person hanging */
        .person {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            animation: balloon-float 4s ease-in-out infinite;
        }
        .person-head {
            width: 22px; height: 22px;
            background: #fcd34d;
            border-radius: 50%;
            margin: 0 auto 2px;
            box-shadow: 0 2px 8px rgba(252,211,77,.4);
        }
        .person-body {
            width: 28px; height: 32px;
            background: linear-gradient(180deg, #6366f1, #818cf8);
            border-radius: 8px 8px 4px 4px;
            margin: 0 auto;
            position: relative;
        }
        .person-body::before, .person-body::after {
            content: '';
            position: absolute;
            top: 6px;
            width: 10px; height: 20px;
            background: #818cf8;
            border-radius: 5px;
        }
        .person-body::before { left: -9px; transform: rotate(-10deg); }
        .person-body::after  { right: -9px; transform: rotate(10deg); }

        @keyframes balloon-float {
            0%,100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-10px); }
        }
        @keyframes string-sway {
            0%,100% { transform: translateX(-50%) rotate(-3deg); }
            50%      { transform: translateX(-50%) rotate(3deg); }
        }

        /* ── 404 text ── */
        .error-code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #93c5fd 0%, #6366f1 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            animation: fadeUp .7s ease-out .1s both;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 10px;
            animation: fadeUp .7s ease-out .2s both;
        }

        .description {
            font-size: .93rem;
            color: #64748b;
            line-height: 1.65;
            margin-bottom: 28px;
            animation: fadeUp .7s ease-out .25s both;
        }

        /* ── Buttons ── */
        .actions {
            display: flex;
            gap: .75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
            animation: fadeUp .7s ease-out .3s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .7rem 1.6rem;
            border-radius: 12px;
            font-size: .88rem;
            font-weight: 600;
            text-decoration: none;
            transition: all .22s ease;
            border: none;
            cursor: pointer;
        }
        .btn svg { width: 15px; height: 15px; }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: #fff;
            box-shadow: 0 4px 18px rgba(99,102,241,.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(99,102,241,.4); }

        .btn-outline {
            background: rgba(255,255,255,.85);
            color: #374151;
            border: 1.5px solid #e2e8f0;
            backdrop-filter: blur(8px);
        }
        .btn-outline:hover { background: #fff; border-color: #cbd5e1; transform: translateY(-2px); }

        /* ── Footer links ── */
        .footer-links {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp .7s ease-out .4s both;
        }
        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: .78rem;
            font-weight: 500;
            transition: color .2s;
        }
        .footer-links a:hover { color: #6366f1; }
        .footer-links .sep { color: #cbd5e1; align-self: center; }

        @media (max-width: 480px) {
            .actions { flex-direction: column; align-items: center; }
            .btn { justify-content: center; width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Sky stars -->
    <div class="stars">
        <div class="star" style="width:4px;height:4px;top:10%;left:15%;--d:2.5s;--delay:0s"></div>
        <div class="star" style="width:3px;height:3px;top:6%;left:45%;--d:3.5s;--delay:.5s"></div>
        <div class="star" style="width:5px;height:5px;top:15%;left:72%;--d:2s;--delay:1s"></div>
        <div class="star" style="width:3px;height:3px;top:20%;left:88%;--d:4s;--delay:.2s"></div>
        <div class="star" style="width:4px;height:4px;top:8%;left:62%;--d:3s;--delay:1.5s"></div>
    </div>

    <!-- Floating clouds -->
    <div class="clouds-layer">
        <div class="cloud cloud-lg c1"><div class="cloud-body"></div></div>
        <div class="cloud cloud-md c2"><div class="cloud-body"></div></div>
        <div class="cloud cloud-sm c3"><div class="cloud-body"></div></div>
        <div class="cloud cloud-lg c4"><div class="cloud-body"></div></div>
        <div class="cloud cloud-sm c5"><div class="cloud-body"></div></div>
        <div class="cloud cloud-md c6"><div class="cloud-body"></div></div>
    </div>

    <div class="ground"></div>

    <!-- Main content -->
    <div class="card">

        <!-- Balloon illustration -->
        <div class="illustration">
            <div class="balloon"></div>
            <div class="string"></div>
            <div class="person">
                <div class="person-head"></div>
                <div class="person-body"></div>
            </div>
        </div>

        <div class="error-code">404</div>
        <h1 class="title">Page Not Found</h1>
        <p class="description">
            The page you're looking for doesn't exist or<br>
            has been moved to a different location.
        </p>

        <div class="actions">
            <a href="https://demo14.sellsull.com" class="btn btn-primary">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
                </svg>
                Go Home
            </a>
            <a href="http://demo14.sellsull.com/" class="btn btn-outline">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                Go Back
            </a>
        </div>

        <div class="footer-links">
            <a href="https://demo14.sellsull.com/shop">Browse Products</a>
            <span class="sep">·</span>
            <a href="https://demo14.sellsull.com/contact-us">Contact Us</a>
            <span class="sep">·</span>
            <a href="https://demo14.sellsull.com/about-us">About Us</a>
        </div>

    </div>

</body>
</html>
